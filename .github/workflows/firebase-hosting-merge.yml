name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main # Asegúrate de que esta es tu rama principal

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # <--- ¡AÑADIDO! Usar Node.js 20 para mejor compatibilidad con Firebase Frameworks
          cache: 'npm' # <--- ¡AÑADIDO! Habilitar caché de npm para instalaciones más rápidas

      - name: Install dependencies and Build Next.js app
        run: |
          npm ci
          npm run build
        env: # <--- ¡CRÍTICO! Añadida sección 'env' para el build
          NPM_CONFIG_LOGLEVEL: error # Suprimir advertencias de npm
          NODE_OPTIONS: --max_old_space_size=4096 # Opcional: Aumentar memoria si el build es muy grande
          # --- ¡CRÍTICO! Variables de entorno para Firebase (Frontend) ---
          # Los valores de estas variables se obtienen de los Secretos de GitHub (Settings > Secrets and variables > Actions).
          # NUNCA escribas los valores reales directamente aquí en el archivo YAML del repositorio.
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_MAPS_API_KEY }}
          # --- ¡NUEVAS VARIABLES DE ENTORNO PARA FIREBASE ADMIN SDK! ---
          # Estas son las que tu firebase-admin.ts necesita para inicializarse en el servidor
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          # ---------------------------------------------------------------
          
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' # Esta variable aún se usa para la autenticación de la acción
          projectId: 'mi-workflow-app' # Tu ID de proyecto de Firebase
          channelId: 'live' # O 'preview' para ramas que no sean main
        # env: # <--- ¡ELIMINADO! FIREBASE_CLI_EXPERIMENTS ya no es necesario aquí
        #   FIREBASE_CLI_EXPERIMENTS: webframeworks
    